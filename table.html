<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recept Táblázat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
            <li><a href="home.html">Főoldal</a></li>
            <li><a href="recipes.html">Receptgyűjtemény</a></li>
            <li><a href="table.html">Táblázat</a></li>
            <li><a href="form.html">Recept Beküldés</a></li>
            <li><a href="about.html">Rólunk</a></li>
            </ul>
        </nav>
    </header>

    <table id="receptTabla">
        <thead>
            <tr>
                <th>Étel neve</th>
                <th>Elkészítési idő</th>
                <th>Költség</th>
                <th>Nehézség</th>
                <th>Szénhidrát</th>
                <th>Kalória</th>
                <th>Feltöltő neve</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <footer>
        <p>&copy; 2025 Receptgyűjtemény. Minden jog fenntartva.</p>
    </footer>

    <script>
        const receptek = [
            { nev: "Tyúkhúsleves", ido: "195 perc", koltseg: "Megfizethető", nehezseg: "könnyű", szenhidrat: "49.4 g", kaloria: "584 kcal", feltolto: "Papp Zoltán", link: "recipes.html#husleves" },
            { nev: "Csirke paprikás", ido: "90 perc", koltseg: "Megfizethető", nehezseg: "Közepes", szenhidrat: "14.3 g", kaloria: "779 kcal", feltolto: "Kovács Anna", link: "recipes.html#csirkepaprikas" },
            { nev: "Túrógombóc", ido: "30 perc", koltseg: "Megfizethető", nehezseg: "Közepes", szenhidrat: "94.6 g", kaloria: "800 kcal", feltolto: "Nagy Péter", link: "recipes.html#turogomboc" },
            { nev: "Gúlyásleves", ido: "195 perc", koltseg: "Olcsó", nehezseg: "Közepes", szenhidrat: "37.1 g", kaloria: "352 kcal", feltolto: "Kovács Anna", link: "recipes.html#gulyasleves" },
            { nev: "Hortobágyi húsos palacsinta", ido: "90 perc", koltseg: "Megfizethető", nehezseg: "Közepes", szenhidrat: "49 g", kaloria: "1157 kcal", feltolto: "Nagy Péter", link: "recipes.html#husospali" },
            { nev: "Lecsó", ido: "60 perc", koltseg: "Olcsó", nehezseg: "Könnyű", szenhidrat: "18 g", kaloria: "210 kcal", feltolto: "Szabó Katalin", link: "recipes.html#lecsó" },
            { nev: "Rakott krumpli", ido: "75 perc", koltseg: "Megfizethető", nehezseg: "Közepes", szenhidrat: "45 g", kaloria: "520 kcal", feltolto: "Kiss Tamás", link: "recipes.html#rakottkrumpli" },
            { nev: "Töltött káposzta", ido: "150 perc", koltseg: "Közepes", nehezseg: "Nehéz", szenhidrat: "36 g", kaloria: "680 kcal", feltolto: "Nagy Péter", link: "recipes.html#toltottkaposzta" },
            { nev: "Pörkölt", ido: "120 perc", koltseg: "Megfizethető", nehezseg: "Közepes", szenhidrat: "22 g", kaloria: "760 kcal", feltolto: "Kovács Anna", link: "recipes.html#porkolt" },
            { nev: "Fasírozott", ido: "90 perc", koltseg: "Olcsó", nehezseg: "Könnyű", szenhidrat: "15 g", kaloria: "550 kcal", feltolto: "Szabó Katalin", link: "recipes.html#fasirt" },
            { nev: "Kocsonya", ido: "240 perc", koltseg: "Közepes", nehezseg: "Nehéz", szenhidrat: "5 g", kaloria: "410 kcal", feltolto: "Kiss Tamás", link: "recipes.html#kocsonya" },
            { nev: "Rántott hús", ido: "60 perc", koltseg: "Megfizethető", nehezseg: "Könnyű", szenhidrat: "30 g", kaloria: "680 kcal", feltolto: "Nagy Péter", link: "recipes.html#rantotthus" },
            { nev: "Körözött", ido: "30 perc", koltseg: "Olcsó", nehezseg: "Könnyű", szenhidrat: "8 g", kaloria: "280 kcal", feltolto: "Kovács Anna", link: "recipes.html#korozott" },
            { nev: "Jókai bableves", ido: "150 perc", koltseg: "Megfizethető", nehezseg: "Közepes", szenhidrat: "40 g", kaloria: "670 kcal", feltolto: "Szabó Katalin", link: "recipes.html#jokaibableves" },
            { nev: "Halászlé", ido: "120 perc", koltseg: "Közepes", nehezseg: "Közepes", szenhidrat: "10 g", kaloria: "390 kcal", feltolto: "Kiss Tamás", link: "recipes.html#halaszle" },
            { nev: "Rántott sajt", ido: "45 perc", koltseg: "Olcsó", nehezseg: "Könnyű", szenhidrat: "32 g", kaloria: "530 kcal", feltolto: "Nagy Péter", link: "recipes.html#rantottsajt" },
            { nev: "Túrós csusza", ido: "40 perc", koltseg: "Olcsó", nehezseg: "Könnyű", szenhidrat: "58 g", kaloria: "600 kcal", feltolto: "Kovács Anna", link: "recipes.html#turoscsusza" },
            { nev: "Paprikás krumpli", ido: "60 perc", koltseg: "Olcsó", nehezseg: "Könnyű", szenhidrat: "42 g", kaloria: "450 kcal", feltolto: "Szabó Katalin", link: "recipes.html#paprikaskrumpli" },
            { nev: "Madártej", ido: "30 perc", koltseg: "Olcsó", nehezseg: "Könnyű", szenhidrat: "55 g", kaloria: "320 kcal", feltolto: "Kiss Tamás", link: "recipes.html#madartej" },
            { nev: "Mákos guba", ido: "45 perc", koltseg: "Megfizethető", nehezseg: "Könnyű", szenhidrat: "72 g", kaloria: "780 kcal", feltolto: "Nagy Péter", link: "recipes.html#makosguba" },
            { nev: "Dobos torta", ido: "120 perc", koltseg: "Drága", nehezseg: "Nehéz", szenhidrat: "95 g", kaloria: "1100 kcal", feltolto: "Kovács Anna", link: "recipes.html#dobostorta" },
            { nev: "Grízes tészta", ido: "30 perc", koltseg: "Olcsó", nehezseg: "Könnyű", szenhidrat: "65 g", kaloria: "480 kcal", feltolto: "Szabó Katalin", link: "recipes.html#grizes_teszta" },
            { nev: "Vadas marha zsemlegombóccal", ido: "180 perc", koltseg: "Közepes", nehezseg: "Nehéz", szenhidrat: "40 g", kaloria: "720 kcal", feltolto: "Kiss Tamás", link: "recipes.html#vadas_marha" },
            { nev: "Tökfőzelék pörkölttel", ido: "90 perc", koltseg: "Megfizethető", nehezseg: "Közepes", szenhidrat: "30 g", kaloria: "540 kcal", feltolto: "Nagy Péter", link: "recipes.html#tokfozelek" },
            { nev: "Ropogós sült kacsacomb párolt káposztával", ido: "150 perc", koltseg: "Drága", nehezseg: "Közepes", szenhidrat: "25 g", kaloria: "880 kcal", feltolto: "Kovács Anna", link: "recipes.html#kacsacomb" }
        ];
        const tablaBody = document.querySelector("#receptTabla tbody");
        receptek.forEach(recept => {
            const sor = document.createElement("tr");

            const nevCella = document.createElement("td");
            const link = document.createElement("a");
            link.href = recept.link;
            link.className = "recept-link";
            link.textContent = recept.nev;
            nevCella.appendChild(link);
            sor.appendChild(nevCella);

            ["ido", "koltseg", "nehezseg", "szenhidrat", "kaloria", "feltolto"].forEach(kulcs => {
                const cella = document.createElement("td");
                cella.textContent = recept[kulcs];
                sor.appendChild(cella);
            });

            tablaBody.appendChild(sor);
        });
        document.querySelectorAll(".recept-link").forEach(linkElem => {
            linkElem.addEventListener("click", function(event) {
                event.preventDefault(); // Megakadályozza az automatikus navigációt
                const fullHref = this.getAttribute("href");
                const targetId = fullHref.split("#")[1];

                fetch('recipes.html')
                    .then(response => {
                        if (!response.ok) throw new Error('Nem sikerült betölteni a recipes.html fájlt.');
                        return response.text();
                    })
                    .then(htmlText => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlText, 'text/html');
                        const targetElement = doc.getElementById(targetId);

                        if (targetElement) {
                            // Ha megtalálta az ID-t, akkor navigálunk
                            window.location.href = fullHref;
                        } else {
                            alert(`Hiba: A hivatkozott szakasz ("#${targetId}") nem található a recipes.html oldalon. Még nincs recept feltöltve hozzá.`);
                        }
                    })
                    .catch(error => {
                        console.error("Hiba a receptlink ellenőrzése közben:", error);
                        alert("Nem sikerült ellenőrizni a recept linket.");
                    });
            });
        });
    </script>
</body>
</html>
